version: "3.8"

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./frontend:/app
    restart: always
    environment:
      - TZ=Asia/Seoul
      - VUE_APP_BASE_URL=/api

  backend:
    environment:
      - TZ=Asia/Seoul
      - CONDA_DEFAULT_ENV=cellcraft-test
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /var/run/docker.sock:/var/run/docker.sock
      # Plugin directory mounts
      - ./backend/plugin/official:/app/plugin/official:ro
      - ./backend/plugin/local:/app/plugin/local:rw
      - ./backend/plugin/build_logs:/app/plugin/build_logs:rw
    depends_on:
      db:
        condition: service_healthy
    restart: always

  db:
    image: postgres:15
    environment:
      - TZ=Asia/Seoul
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: "rabbitmq:management"
    environment:
      - TZ=Asia/Seoul
    expose:
      - "15672"
      - "5672"
    restart: always

  celery:
    environment:
      - CONDA_DEFAULT_ENV=cellcraft-test
      - C_FORCE_ROOT=true
      - TZ=Asia/Seoul
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    ipc: host
    build:
      context: ./backend
      dockerfile: Dockerfile.celery.prod
    volumes:
      - ./backend:/app
      - /var/run/docker.sock:/var/run/docker.sock
      # Plugin directory mounts
      - ./backend/plugin/official:/app/plugin/official:ro
      - ./backend/plugin/local:/app/plugin/local:rw
      - ./backend/plugin/build_logs:/app/plugin/build_logs:rw
    depends_on:
      rabbitmq:
        condition: service_started
      db:
        condition: service_healthy
    restart: always

  jenkins:
    build:
      context: ./docker
      dockerfile: Dockerfile.jenkins
    image: cellcraft/jenkins:latest
    container_name: cellcraft_jenkins
    restart: always
    environment:
      - TZ=Asia/Seoul
      - PLAYWRIGHT_BROWSERS_PATH=/opt/playwright-browsers
      # Initial setup wizard enabled for first-time configuration
      # Remove this line after completing initial setup for faster restarts
    ports:
      - "9090:8080"  # Jenkins UI (accessible at localhost:9090)
      - "50000:50000"  # Jenkins agent
    expose:
      - "8080"   # Jenkins UI (internal access)
    volumes:
      - jenkins_data:/var/jenkins_home
      - playwright_browsers:/opt/playwright-browsers
      - /var/run/docker.sock:/var/run/docker.sock
      - ./backend:/workspace/backend:ro
      - ./frontend:/workspace/frontend:ro
      - ./tests:/workspace/tests:ro
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    networks:
      - default
    user: root  # Required for Docker socket access

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: cellcraft_uptime_kuma
    restart: always
    environment:
      - TZ=Asia/Seoul
    ports:
      - "3001:3001"  # Uptime Kuma UI (accessible at localhost:3001)
    expose:
      - "3001"  # Uptime Kuma UI (internal access)
    volumes:
      - uptime_kuma_data:/app/data
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    networks:
      - default

volumes:
  postgres_data:
  jenkins_data:
  playwright_browsers:
  uptime_kuma_data:
