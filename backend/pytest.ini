[pytest]
# Test discovery patterns
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Command-line options
addopts =
    -v
    --strict-markers
    --cov=app
    --cov-report=html
    --cov-report=term-missing
    --cov-report=term:skip-covered
    --cov-fail-under=0
    --tb=short

# Test markers (use with @pytest.mark.marker_name)
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (database, external services)
    slow: Slow tests (>5 seconds)
    celery: Celery task tests
    refactor: Tests highlighting refactoring needs
    api: API endpoint tests
    auth: Authentication/authorization tests
    crud: CRUD operation tests
    config: Configuration and settings tests
    security: Security and cryptography tests
    enum: Enumeration tests
    error: Error handling and exception tests
    models: SQLAlchemy database model tests
    benchmark: Performance benchmark tests (excluded from normal runs)

# Asyncio configuration
asyncio_mode = auto

# Coverage options
[coverage:run]
source = app
omit =
    */tests/*
    */conftest.py
    */__pycache__/*
    */migrations/*
    */alembic/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
