name: snakemake
channels:
  - bioconda
  - conda-forge
  - defaults
dependencies:
  # Core Python
  - python=3.10.6
  - pip=22.2.2
  - setuptools=65.3.0
  - wheel=0.37.1
  
  # Database
  - psycopg2=2.9.3
  - psycopg2-binary=2.9.3
  
  # System libraries
  - ca-certificates=2022.07.19
  - openssl=1.1.1q
  - libpq=14.5
  - libffi=3.4.2
  
  # Scientific computing (required by scanpy)
  - numpy=1.23.5
  - pandas=1.5.0
  - matplotlib=3.5.2
  - matplotlib-base=3.5.2
  
  # System monitoring
  - psutil=5.9.2
  
  # Required by matplotlib
  - freetype=2.11.0
  - pillow=9.2.0
  
  - pip:
      # Web framework
      - fastapi==0.92.0
      - starlette==0.25.0
      - uvicorn==0.17.6
      - sse-starlette==1.6.1
      
      # Database
      - sqlalchemy==1.4.36
      - alembic==1.13.2
      
      # Data validation
      - pydantic==1.9.1
      
      # Task queue
      - celery==5.4.0
      - kombu==5.3.4
      - billiard==4.2.0
      - vine==5.1.0
      - amqp==5.1.1
      - celery-singleton>=0.3.1
      - celery-pool-asyncio>=0.2.0
      
      # Authentication & Security
      - python-jose==3.3.0
      - passlib==1.7.4
      - pyjwt==2.4.0
      - bcrypt==3.2.2
      - cryptography==37.0.2
      
      # Docker
      - docker==7.1.0
      
      # HTTP client
      - requests==2.27.1
      - urllib3==1.26.9
      
      # Single-cell analysis
      - scanpy==1.9.2
      - anndata==0.8.0
      - h5py==3.8.0
      
      # Scientific computing (required by scanpy)
      - scipy==1.10.1
      - scikit-learn==1.2.1
