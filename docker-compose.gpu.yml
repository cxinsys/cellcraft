version: "3.8"

services:
  frontend:
    image: ghcr.io/cxinsys/cellcraft/frontend:latest
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      - TZ=Asia/Seoul
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    image: ghcr.io/cxinsys/cellcraft/backend-gpu:latest
    environment:
      - TZ=Asia/Seoul
      - CONDA_DEFAULT_ENV=snakemake
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - RABBITMQ_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-guest}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      # Initial admin account on first startup (optional, see README)
      - CELLCRAFT_ADMIN_EMAIL=${CELLCRAFT_ADMIN_EMAIL:-}
      - CELLCRAFT_ADMIN_PASSWORD=${CELLCRAFT_ADMIN_PASSWORD:-}
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount entire backend for consistency with celery service
      - ./backend:/app
      # Override official plugin directory as read-only
      - ./backend/plugin/official:/app/plugin/official:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  db:
    image: postgres:15
    environment:
      - TZ=Asia/Seoul
      - POSTGRES_DB=${POSTGRES_DB:?.env not found - run scripts/ensure-env.sh or the install script (see README)}
      - POSTGRES_USER=${POSTGRES_USER:?.env not found - run scripts/ensure-env.sh or the install script (see README)}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?.env not found - run scripts/ensure-env.sh or the install script (see README)}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    command: ["sh", "-c", "exec redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --requirepass \"$$REDIS_PASSWORD\""]
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "[ -z \"$$REDIS_PASSWORD\" ] || export REDISCLI_AUTH=\"$$REDIS_PASSWORD\"; redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: "rabbitmq:management"
    environment:
      - TZ=Asia/Seoul
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
    restart: unless-stopped
    networks:
      - app-network

  celery:
    image: ghcr.io/cxinsys/cellcraft/celery-gpu:latest
    environment:
      - CONDA_DEFAULT_ENV=snakemake
      - C_FORCE_ROOT=true
      - TZ=Asia/Seoul
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - RABBITMQ_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-guest}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - GPU_COUNT=${GPU_COUNT:-0}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount entire backend for Docker-in-Docker compatibility
      - ./backend:/app
      # Override official plugin directory as read-only
      - ./backend/plugin/official:/app/plugin/official:ro
    depends_on:
      rabbitmq:
        condition: service_started
      db:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: "${GPU_COUNT:-all}"
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data: