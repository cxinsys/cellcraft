version: "3.8"

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - TZ=Asia/Seoul
      - VUE_APP_BASE_URL=http://localhost:8000
    restart: always
    networks:
      - app-network

  backend:
    environment:
      - TZ=Asia/Seoul
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /var/run/docker.sock:/var/run/docker.sock
      # Plugin directory mounts
      - ./backend/plugin/official:/app/plugin/official:ro
      - ./backend/plugin/local:/app/plugin/local:rw
      - ./backend/plugin/build_logs:/app/plugin/build_logs:rw
    depends_on:
      - db
      - redis
    restart: always
    networks:
      - app-network

  db:
    image: postgres:15
    environment:
      - TZ=Asia/Seoul
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  test-db:
    image: postgres:15
    environment:
      - TZ=Asia/Seoul
      - POSTGRES_DB=cellcraft_test
      - POSTGRES_USER=test_user
      - POSTGRES_PASSWORD=test_pass
    ports:
      - "5433:5432"  # Host 5433 -> Container 5432 (avoid conflict with db)
    networks:
      - app-network
    # No volumes - ephemeral test database
    # No restart - manual control for testing
    # No healthcheck - keep it minimal

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    restart: always
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: "rabbitmq:management"
    ports:
      - "15672:15672"
      - "5672:5672"
    environment:
      - TZ=Asia/Seoul
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
    restart: always
    networks:
      - app-network

  celery:
      environment:
        - C_FORCE_ROOT=true
        - TZ=Asia/Seoul
      ipc: host
      build:
        context: ./backend
        dockerfile: Dockerfile.dev.celery
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
        - ./backend:/app
        # Plugin directory mounts
        - ./backend/plugin/official:/app/plugin/official:ro
        - ./backend/plugin/local:/app/plugin/local:rw
        - ./backend/plugin/build_logs:/app/plugin/build_logs:rw
      depends_on:
        - rabbitmq
        - db
      deploy:
        resources:
          reservations:
            devices:
              - driver: nvidia
                count: "${GPU_COUNT:-all}"  # 사용자가 설정하지 않으면 모든 GPU 사용
                capabilities: [gpu]
      restart: always
      networks:
        - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
