version: "3.8"

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - TZ=Asia/Seoul
      - VUE_APP_BASE_URL=http://localhost:8000
    restart: always
    networks:
      - app-network

  backend:
    environment:
      - TZ=Asia/Seoul
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - RABBITMQ_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-guest}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      # Initial admin account on first startup (optional, see README)
      - CELLCRAFT_ADMIN_EMAIL=${CELLCRAFT_ADMIN_EMAIL:-}
      - CELLCRAFT_ADMIN_PASSWORD=${CELLCRAFT_ADMIN_PASSWORD:-}
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /var/run/docker.sock:/var/run/docker.sock
      # Plugin directory mounts
      - ./backend/plugin/official:/app/plugin/official:ro
      - ./backend/plugin/local:/app/plugin/local:rw
      - ./backend/plugin/build_logs:/app/plugin/build_logs:rw
    depends_on:
      - db
      - redis
    restart: always
    networks:
      - app-network

  db:
    image: postgres:15
    environment:
      - TZ=Asia/Seoul
      - POSTGRES_DB=${POSTGRES_DB:?.env not found - run scripts/ensure-env.sh (see README)}
      - POSTGRES_USER=${POSTGRES_USER:?.env not found - run scripts/ensure-env.sh (see README)}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?.env not found - run scripts/ensure-env.sh (see README)}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  test-db:
    image: postgres:15
    environment:
      - TZ=Asia/Seoul
      - POSTGRES_DB=cellcraft_test
      - POSTGRES_USER=test_user
      - POSTGRES_PASSWORD=test_pass
    ports:
      - "127.0.0.1:5433:5432"  # Host 5433 -> Container 5432 (avoid conflict with db), localhost only
    networks:
      - app-network
    # No volumes - ephemeral test database
    # No restart - manual control for testing
    # No healthcheck - keep it minimal

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"  # localhost only
    volumes:
      - redis_data:/data
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    command: ["sh", "-c", "exec redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --requirepass \"$$REDIS_PASSWORD\""]
    restart: always
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "[ -z \"$$REDIS_PASSWORD\" ] || export REDISCLI_AUTH=\"$$REDIS_PASSWORD\"; redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: "rabbitmq:management"
    ports:
      - "127.0.0.1:15672:15672"  # localhost only
      - "127.0.0.1:5672:5672"
    environment:
      - TZ=Asia/Seoul
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-guest}
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
    restart: always
    networks:
      - app-network

  celery:
      environment:
        - C_FORCE_ROOT=true
        - TZ=Asia/Seoul
        - GPU_COUNT=${GPU_COUNT:-0}
        - POSTGRES_DB=${POSTGRES_DB}
        - POSTGRES_USER=${POSTGRES_USER}
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        - POSTGRES_HOST=db
        - POSTGRES_PORT=5432
        - RABBITMQ_USER=${RABBITMQ_USER:-guest}
        - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-guest}
        - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      ipc: host
      build:
        context: ./backend
        dockerfile: Dockerfile.dev.celery
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
        - ./backend:/app
        # Plugin directory mounts
        - ./backend/plugin/official:/app/plugin/official:ro
        - ./backend/plugin/local:/app/plugin/local:rw
        - ./backend/plugin/build_logs:/app/plugin/build_logs:rw
      depends_on:
        - rabbitmq
        - db
      deploy:
        resources:
          reservations:
            devices:
              - driver: nvidia
                count: "${GPU_COUNT:-all}"  # 사용자가 설정하지 않으면 모든 GPU 사용
                capabilities: [gpu]
      restart: always
      networks:
        - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
