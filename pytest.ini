[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test markers for categorization
markers =
    cpu_mode: CPU mode deployment tests
    gpu_mode: GPU mode deployment tests
    slow: Slow running tests (> 30 seconds)
    requires_network: Tests requiring internet connection
    requires_gpu: Tests requiring NVIDIA GPU
    windows: Windows WSL2 specific tests
    macos: macOS specific tests
    linux: Linux specific tests
    macos_skip: Tests not compatible with macOS (e.g., GPU, Custom Plugin)
    docker_desktop: Docker Desktop specific tests
    native_docker: Native Docker Engine specific tests
    arm64: ARM64/Apple Silicon architecture tests
    amd64: AMD64/x86_64 architecture tests

# Output options
addopts =
    --verbose
    --tb=short
    --strict-markers

# Test discovery patterns
norecursedirs = .git .tox dist build *.egg node_modules

# Minimum pytest version
minversion = 7.0
