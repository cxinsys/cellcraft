name: Build and Push GHCR Multi-platform Images

# 다양한 트리거 옵션
on:
  # 1. 수동 실행 (GitHub UI에서 버튼 클릭)
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag version (e.g., v1.0.1)'
        required: true
        default: 'latest'
      build_backend_cpu:
        description: 'Build backend-cpu image'
        type: boolean
        default: true
      build_celery_cpu:
        description: 'Build celery-cpu image'
        type: boolean
        default: true
      build_backend_gpu:
        description: 'Build backend-gpu image (amd64 only)'
        type: boolean
        default: true
      build_celery_gpu:
        description: 'Build celery-gpu image (amd64 only)'
        type: boolean
        default: true
      build_frontend:
        description: 'Build frontend image'
        type: boolean
        default: true
      no_cache_cpu:
        description: 'Build CPU images without cache (use when Dockerfile structure changes)'
        type: boolean
        default: false
      no_cache_gpu:
        description: 'Build GPU images without cache'
        type: boolean
        default: false
      no_cache_frontend:
        description: 'Build frontend image without cache'
        type: boolean
        default: false

  # 2. main 브랜치에 push 시 자동 실행 & 3. 버전 태그 생성 시 자동 실행
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/build-ghcr-images.yml'

  # 4. Pull Request 시 빌드 테스트 (push는 안함)
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/cxinsys/cellcraft

jobs:
  # Backend CPU 이미지 빌드 (병렬 Job 1)
  build-backend-cpu:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.build_backend_cpu == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.CELLCRAFT_GHCR }}

      - name: Determine image tags
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=latest" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Backend CPU
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.cpu
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/backend-cpu:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE_PREFIX }}/backend-cpu:latest
          no-cache: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.no_cache_cpu == 'true' }}
          cache-from: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.no_cache_cpu != 'true') && 'type=gha,scope=backend-cpu-v2' || '' }}
          cache-to: type=gha,mode=max,scope=backend-cpu-v2
          build-args: |
            BUILDDATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            VERSION=${{ steps.meta.outputs.version }}

  # Celery CPU 이미지 빌드 (병렬 Job 2)
  build-celery-cpu:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.build_celery_cpu == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.CELLCRAFT_GHCR }}

      - name: Determine image tags
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=latest" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Celery CPU
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.cpu.celery
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/celery-cpu:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE_PREFIX }}/celery-cpu:latest
          no-cache: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.no_cache_cpu == 'true' }}
          cache-from: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.no_cache_cpu != 'true') && 'type=gha,scope=celery-cpu-v2' || '' }}
          cache-to: type=gha,mode=max,scope=celery-cpu-v2
          build-args: |
            BUILDDATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            VERSION=${{ steps.meta.outputs.version }}

  # Backend GPU 이미지 빌드 (병렬 Job 3)
  build-backend-gpu:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.build_backend_gpu == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.CELLCRAFT_GHCR }}

      - name: Determine image tags
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=latest" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Backend GPU
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.gpu
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/backend-gpu:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE_PREFIX }}/backend-gpu:latest
          no-cache: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.no_cache_gpu == 'true' }}
          cache-from: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.no_cache_gpu != 'true') && 'type=gha,scope=backend-gpu' || '' }}
          cache-to: type=gha,mode=max,scope=backend-gpu
          build-args: |
            BUILDDATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            VERSION=${{ steps.meta.outputs.version }}

  # Celery GPU 이미지 빌드 (병렬 Job 4)
  build-celery-gpu:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.build_celery_gpu == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.CELLCRAFT_GHCR }}

      - name: Determine image tags
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=latest" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Celery GPU
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.gpu.celery
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/celery-gpu:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE_PREFIX }}/celery-gpu:latest
          no-cache: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.no_cache_gpu == 'true' }}
          cache-from: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.no_cache_gpu != 'true') && 'type=gha,scope=celery-gpu' || '' }}
          cache-to: type=gha,mode=max,scope=celery-gpu
          build-args: |
            BUILDDATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            VERSION=${{ steps.meta.outputs.version }}

  # Frontend 이미지 빌드 (병렬 Job 5)
  build-frontend:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.build_frontend == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.CELLCRAFT_GHCR }}

      - name: Determine image tags
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=latest" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.local
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/frontend:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE_PREFIX }}/frontend:latest
          no-cache: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.no_cache_frontend == 'true' }}
          cache-from: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.no_cache_frontend != 'true') && 'type=gha,scope=frontend-v1' || '' }}
          cache-to: type=gha,mode=max,scope=frontend-v1
          build-args: |
            BUILDDATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            VERSION=${{ steps.meta.outputs.version }}

  # 빌드 결과 요약 (모든 빌드 완료 후 실행)
  build-summary:
    needs: [build-backend-cpu, build-celery-cpu, build-backend-gpu, build-celery-gpu, build-frontend]
    runs-on: ubuntu-latest
    if: ${{ always() && !cancelled() }}
    steps:
      - name: Build summary
        run: |
          # 상태 이모지 함수
          status_emoji() {
            case "$1" in
              success) echo "✅" ;;
              failure) echo "❌" ;;
              skipped) echo "⏭️" ;;
              cancelled) echo "🚫" ;;
              *) echo "❓" ;;
            esac
          }

          echo "### Build Summary :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Trigger** | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | ${{ github.event.inputs.image_tag || 'latest' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${GITHUB_SHA::7}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### :package: CPU Images (linux/amd64, linux/arm64)" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Status | Cache |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend CPU | $(status_emoji '${{ needs.build-backend-cpu.result }}') ${{ needs.build-backend-cpu.result }} | ${{ github.event.inputs.no_cache_cpu == 'true' && 'Disabled' || 'Enabled' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Celery CPU | $(status_emoji '${{ needs.build-celery-cpu.result }}') ${{ needs.build-celery-cpu.result }} | ${{ github.event.inputs.no_cache_cpu == 'true' && 'Disabled' || 'Enabled' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### :video_game: GPU Images (linux/amd64 only)" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Status | Cache |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend GPU | $(status_emoji '${{ needs.build-backend-gpu.result }}') ${{ needs.build-backend-gpu.result }} | ${{ github.event.inputs.no_cache_gpu == 'true' && 'Disabled' || 'Enabled' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Celery GPU | $(status_emoji '${{ needs.build-celery-gpu.result }}') ${{ needs.build-celery-gpu.result }} | ${{ github.event.inputs.no_cache_gpu == 'true' && 'Disabled' || 'Enabled' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### :globe_with_meridians: Frontend (linux/amd64, linux/arm64)" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Status | Cache |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | $(status_emoji '${{ needs.build-frontend.result }}') ${{ needs.build-frontend.result }} | ${{ github.event.inputs.no_cache_frontend == 'true' && 'Disabled' || 'Enabled' }} |" >> $GITHUB_STEP_SUMMARY
